name: Release

on:
  push:
#    tags:
#      - 'v*'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform: windows-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build workspace
        run: cargo build --workspace --release --all-features --target ${{ matrix.target }} --verbose

      - name: Stage binaries
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir dist
          for bin in aspect2-stm32-updater postcode_emu soundchip_cli flash_cli i2c_scan; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" "dist/${bin}${ext}"
          done

      - name: Package artifact
        shell: bash
        run: |
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "../libaspect2-${{ matrix.platform }}.zip" ./*
          else
            tar czf "../libaspect2-${{ matrix.platform }}.tar.gz" ./*
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libaspect2-${{ matrix.platform }}
          path: libaspect2-${{ matrix.platform }}.*

  create_release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_artifacts_all
          merge-multiple: true

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: release_artifacts_all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
